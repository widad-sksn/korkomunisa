name: Deploy to Server

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-to-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GEMINI_API_KEY
          command_timeout: 30m
          script: |
            cd /var/www/korkomunisa
            if [ -n "$GEMINI_API_KEY" ]; then
              sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" .env || true
            fi
            sed -i "s|^GEMINI_MODEL=.*|GEMINI_MODEL=gemini-3.1-flash-lite|" .env || true
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --remove-orphans --build
            docker compose exec -T app php artisan migrate --force || true
            docker compose exec -T app php artisan optimize:clear || true
            docker compose exec -T app php artisan view:clear || true
            docker compose exec -T app php artisan cache:clear || true
            docker compose exec -T app php artisan config:cache || true
            docker compose exec -T app php artisan route:cache || true
            docker compose exec -T app php artisan view:cache || true
            docker compose exec -T app php artisan content:translate-missing || true
            docker compose exec -T app php artisan queue:restart || true
